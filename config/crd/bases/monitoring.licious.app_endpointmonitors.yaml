---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: endpointmonitors.monitoring.licious.app
spec:
  group: monitoring.licious.app
  names:
    kind: EndpointMonitor
    listKind: EndpointMonitorList
    plural: endpointmonitors
    singular: endpointmonitor
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EndpointMonitorSpec defines the desired state of EndpointMonitor
            properties:
              checkInterval:
                maximum: 31536000
                minimum: 1
                type: integer
              dnsCheck:
                properties:
                  server:
                    type: string
                  tls:
                    type: boolean
                  type:
                    type: string
                  verify:
                    type: string
                type: object
              driver:
                enum:
                - http
                - http-json
                - smtp
                - redis
                - tls
                - tcp
                - dns
                - ping
                - trino
                - opensearch
                - mysql
                type: string
              endpoint:
                type: string
              httpCheck:
                description: HttpCheck defines expected values from a HTTP response
                properties:
                  bodyContains:
                    type: string
                type: object
              httpJsonCheck:
                description: HttpJsonCheck defines expected JSON field values from
                  a HTTP response
                properties:
                  expectedStatusCode:
                    type: integer
                  jsonAssertions:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - jsonAssertions
                type: object
              ipFamily:
                description: |-
                  IpFamily set to ipv4 or ipv6 connects to the endpoint over that address
                  family only. A pinned family connects directly, ignoring HTTP proxy
                  settings, and redirects stay on that family. all runs each check over
                  both families, fails if either fails, and reports the slower response
                  time. Omit the field to leave the choice to the system. For the dns
                  driver it applies to the connection to the DNS server.
                enum:
                - ipv4
                - ipv6
                - all
                type: string
              mysqlCheck:
                properties:
                  maxSecondsBehindMaster:
                    type: integer
                  secretRef:
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              notify:
                description: NotifyConfig holds notifier configurations
                properties:
                  discord:
                    description: DiscordConfig defines Discord notifier config
                    properties:
                      alertOn:
                        items:
                          enum:
                          - success
                          - failure
                          - change
                          type: string
                        type: array
                      enabled:
                        type: boolean
                      webhookUrl:
                        type: string
                    required:
                    - enabled
                    - webhookUrl
                    type: object
                  email:
                    description: EmailConfig is placeholder (no-op for now)
                    properties:
                      alertOn:
                        items:
                          enum:
                          - success
                          - failure
                          - change
                          type: string
                        type: array
                      body:
                        type: string
                      emailProvider:
                        type: string
                      emailSecretRef:
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      enabled:
                        type: boolean
                      from:
                        type: string
                      host:
                        type: string
                      subject:
                        type: string
                      to:
                        items:
                          type: string
                        type: array
                    required:
                    - enabled
                    - to
                    type: object
                  slack:
                    description: SlackConfig defines Slack notifier config
                    properties:
                      alertOn:
                        items:
                          enum:
                          - success
                          - failure
                          - change
                          type: string
                        type: array
                      enabled:
                        type: boolean
                      webhookUrl:
                        type: string
                    required:
                    - enabled
                    - webhookUrl
                    type: object
                  valkey:
                    description: ValkeyConfig defines Valkey status-page notifier
                      config
                    properties:
                      dashboards:
                        items:
                          type: string
                        type: array
                      db:
                        type: integer
                      enabled:
                        type: boolean
                      endpoint:
                        type: string
                      name:
                        type: string
                      retentionDays:
                        type: integer
                      secretRef:
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      tls:
                        type: boolean
                    required:
                    - dashboards
                    - enabled
                    - endpoint
                    type: object
                  webhook:
                    description: WebhookConfig defines Webhook notifier config
                    properties:
                      alertOn:
                        items:
                          enum:
                          - success
                          - failure
                          - change
                          type: string
                        type: array
                      authorization:
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      contentType:
                        type: string
                      contents:
                        type: string
                      enabled:
                        type: boolean
                      webhookUrl:
                        type: string
                    required:
                    - enabled
                    - webhookUrl
                    type: object
                type: object
              redisCheck:
                properties:
                  secretRef:
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  tls:
                    type: boolean
                type: object
              smtpCheck:
                properties:
                  emailSecretRef:
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  fromAssertion:
                    type: string
                  helo:
                    type: string
                  startTls:
                    type: boolean
                  tls:
                    type: boolean
                  toAssertion:
                    type: string
                  verifyAssertion:
                    type: string
                type: object
              tlsCheck:
                properties:
                  daysToExpire:
                    type: integer
                  host:
                    type: string
                type: object
            required:
            - checkInterval
            - driver
            - endpoint
            - notify
            type: object
          status:
            description: EndpointMonitorStatus defines the observed state of EndpointMonitor
            properties:
              lastCheckedTime:
                format: date-time
                type: string
              lastNotifiedStatus:
                description: |-
                  LastNotifiedStatus is the status whose change alert has been sent, or
                  that needed none because no notifier subscribes to change. Empty means
                  no change alert has gone out yet. Absent, as on objects written before
                  this field existed, means lastStatus counts as announced.
                type: string
              lastNotifiedStatusChange:
                description: LastNotifiedStatusChange is when the status in lastNotifiedStatus
                  began.
                format: date-time
                type: string
              lastStatus:
                type: string
              lastStatusChange:
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the last check
                  ran against.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
